<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-bold mb-6 text-center">Logowanie</h2>

    <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Nazwa użytkownika</label>
        <input type="text" id="username" class="w-full p-2 border rounded">
    </div>

    <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Hasło</label>
        <input type="password" id="password" class="w-full p-2 border rounded">
    </div>

    <button onclick="loginUser()" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded">
        Zaloguj
    </button>

    <p class="text-center text-sm text-gray-600 mt-4">
        Nie masz konta? <a href="Register" class="text-blue-500">Zarejestruj się</a>
    </p>

    <p id="errorMessage" class="text-red-500 text-center mt-3 hidden"></p>
</div>

<script>
    async function loginUser() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const response = await fetch("http://localhost:8080/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem("token", data.token);
            window.location.href = "/Menu";
        } else {
            document.getElementById("errorMessage").innerText = "Nieprawidłowe dane logowania!";
            document.getElementById("errorMessage").classList.remove("hidden");
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Koszyk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

<div class="container mx-auto p-6">
    <h1 class="text-4xl font-bold">🛒 Twój koszyk</h1>
    <ul id="cart-list" class="space-y-4 mt-6"></ul>
    <button onclick="placeOrder()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded transition mt-4 w-full">✅ Zamów</button>
    <a href="/Menu" class="mt-6 inline-block bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg shadow transition text-center w-full">⬅ Powrót do menu</a>
</div>

<script>
    async function fetchWithCredentials(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            credentials: "include",
            headers: {
                ...options.headers,
                "Content-Type": "application/json"
            }
        });

        if (!response.ok) throw new Error(`Błąd: ${response.status}`);
        return response;
    }

    async function fetchCart() {
        try {
            const response = await fetchWithCredentials("http://localhost:8080/cart/get", {
                method: "GET"
            });

            const books = await response.json();
            const cartList = document.getElementById("cart-list");
            cartList.innerHTML = books.map(book =>
                `<li class="bg-white p-4 rounded-lg shadow-md flex justify-between items-center">
                    <span class="text-lg">${book.title} - ${book.author}</span>
                    <button onclick="removeFromCart(${book.id})" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded transition">❌ Usuń</button>
                </li>`
            ).join('');

        } catch (error) {
            console.error(error);
            alert("Błąd podczas pobierania koszyka!");
        }
    }

    async function placeOrder() {
        try {
            const response = await fetchWithCredentials("http://localhost:8080/cart/order", {
                method: "POST"
            });

            alert("✅ Zamówienie złożone!");
            fetchCart();

        } catch (error) {
            console.error(error);
            alert("Błąd podczas składania zamówienia!");
        }
    }

    async function removeFromCart(bookId) {
        try {
            const response = await fetchWithCredentials(`http://localhost:8080/cart/remove/${bookId}`, {
                method: "DELETE"
            });

            fetchCart();

        } catch (error) {
            console.error(error);
            alert("Błąd podczas usuwania książki!");
        }
    }

    window.onload = fetchCart;
</script>

</body>
</html>
